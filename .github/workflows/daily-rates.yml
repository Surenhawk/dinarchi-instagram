name: Daily rates posters

on:
  schedule:
    # Every day except Friday. GitHub may delay or drop a scheduled run (19-20 Oct: the 15:00 UTC run never started),
    # so the main run starts early and waits for 18:00 Baghdad, and three backups post only if nothing went out yet.
    - cron: '41 14 * * 0-4,6'
    - cron: '13 15 * * 0-4,6'
    - cron: '43 15 * * 0-4,6'
    - cron: '17 16 * * 0-4,6'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Post to Instagram (otherwise only render and commit)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency: daily-rates

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: rates
    steps:
      - uses: actions/checkout@v4
      - name: Already posted today?
        id: gate
        run: |
          DAY=$(TZ=Asia/Baghdad date +%F)
          if [ "${{ github.event_name }}" = schedule ] && [ -f "daily/$DAY/published.json" ]; then
            echo "already posted $DAY"; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: '20'
      - name: Install browser
        if: steps.gate.outputs.skip != 'true'
        run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium

      - name: Read today's prices from the Dinarchi app
        if: steps.gate.outputs.skip != 'true'
        id: fetch
        run: |
          DAY=$(TZ=Asia/Baghdad date +%F)
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          for i in 1 2 3; do
            set +e; python3 dinarchi.py --date "$DAY"; code=$?; set -e
            [ $code -eq 0 ] && exit 0
            [ $code -eq 2 ] && exit 2   # the app answered but a number needs a human look: never post it
            echo "app not reachable, retry in 2 min"; sleep 120
          done
          exit 1

      - name: Draw the posters and the story (Kurdish, and the Arabic edition)
        if: steps.gate.outputs.skip != 'true'
        run: |
          python3 posters.py data/${{ steps.fetch.outputs.day }}.json
          node shoot.js daily/${{ steps.fetch.outputs.day }}
          # Arabic edition (@dinarchi.ar): drawn and committed every day; not posted until that account exists
          python3 posters.py data/${{ steps.fetch.outputs.day }}.json --lang ar
          node shoot.js daily/${{ steps.fetch.outputs.day }}/ar

      - name: Commit images
        if: steps.gate.outputs.skip != 'true'
        id: commit
        run: |
          git config user.name "dinarchi-rates-bot"
          git config user.email "dinarchi-rates-bot@users.noreply.github.com"
          git add data daily
          git commit -m "Rates posters ${{ steps.fetch.outputs.day }}" || true
          git pull --rebase -q origin main && git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Post to Instagram
        if: steps.gate.outputs.skip != 'true' && ((github.event_name == 'schedule' && vars.RATES_AUTOPOST == 'on') || (github.event_name == 'workflow_dispatch' && inputs.publish))
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          DAY=${{ steps.fetch.outputs.day }}
          PAGES="https://surenhawk.github.io/dinarchi-instagram/rates/daily/$DAY"
          BASE="https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.commit.outputs.sha }}/rates/daily/$DAY"
          for i in $(seq 1 20); do
            if curl -sfI "$PAGES/post-1.jpg" >/dev/null && curl -sfI "$PAGES/post-3.jpg" >/dev/null; then BASE="$PAGES"; break; fi
            sleep 15
          done
          echo "media from $BASE"
          if [ "${{ github.event_name }}" = schedule ]; then   # the early run waits for 18:00 Baghdad
            now=$(date -u +%s); at=$(date -u -d 'today 15:00' +%s)
            [ "$now" -lt "$at" ] && { echo "waiting $((at - now))s for 18:00 Baghdad"; sleep $((at - now)); }
          fi
          python3 post.py "$DAY" "$BASE"
          git add daily && git commit -m "Published rates posters $DAY" && git pull --rebase -q origin main && git push

name: Daily rates posters

on:
  schedule:
    # Every day except Friday, posted at 12:00 noon Baghdad (09:00 UTC). GitHub starts scheduled runs late, often by 4-6 hours,
    # so the runs are set early: the first one to start waits until 08:45 UTC, reads the prices and posts; the rest skip.
    # A run that starts after 14:00 Baghdad never posts (late runs posted at 23:00 and after midnight, 26-29 Oct).
    - cron: '17 3 * * 0-4,6'
    - cron: '7 4 * * 0-4,6'
    - cron: '7 5 * * 0-4,6'
    - cron: '7 6 * * 0-4,6'
    - cron: '7 7 * * 0-4,6'
    - cron: '7 8 * * 0-4,6'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Post to Instagram now (otherwise only render and commit)'
        type: boolean
        default: false
      scheduled:
        description: 'Behave like the daily run: wait for 12:00 Baghdad, post once, never after 14:00'
        type: boolean
        default: false

permissions:
  contents: write

concurrency: daily-rates

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: rates
    steps:
      - uses: actions/checkout@v4
      - name: Already posted today? Wait for 12:00 Baghdad
        id: gate
        run: |
          DAY=$(TZ=Asia/Baghdad date +%F)
          if [ "${{ github.event_name }}" = schedule ] || [ "${{ inputs.scheduled }}" = true ]; then
            echo "daily=true" >> "$GITHUB_OUTPUT"
            if [ -f "daily/$DAY/published.json" ]; then echo "already posted $DAY"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            now=$(date -u +%s); at=$(date -u -d 'today 09:00' +%s); last=$(date -u -d 'today 11:00' +%s)
            if [ "$now" -gt "$last" ]; then echo "too late for today's post ($(TZ=Asia/Baghdad date +%H:%M) Baghdad), skipping"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            if [ "$now" -lt $((at - 900)) ]; then echo "waiting $((at - 900 - now))s, prices are read at 11:45 Baghdad"; sleep $((at - 900 - now)); fi
            git pull -q origin main
            if [ -f "daily/$DAY/published.json" ]; then echo "already posted $DAY"; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: '20'
      - name: Install browser
        if: steps.gate.outputs.skip != 'true'
        run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium

      - name: Read today's prices from the Dinarchi app
        if: steps.gate.outputs.skip != 'true'
        id: fetch
        run: |
          DAY=$(TZ=Asia/Baghdad date +%F)
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          for i in 1 2 3; do
            set +e; python3 dinarchi.py --date "$DAY"; code=$?; set -e
            [ $code -eq 0 ] && exit 0
            [ $code -eq 2 ] && exit 2   # the app answered but a number needs a human look: never post it
            echo "app not reachable, retry in 2 min"; sleep 120
          done
          exit 1

      - name: Draw the posters and the three stories (Kurdish, and the Arabic edition)
        if: steps.gate.outputs.skip != 'true'
        run: |
          python3 posters.py data/${{ steps.fetch.outputs.day }}.json
          node shoot.js daily/${{ steps.fetch.outputs.day }}
          # Arabic edition (@dinarchi.ar): drawn and committed every day; not posted until that account exists
          python3 posters.py data/${{ steps.fetch.outputs.day }}.json --lang ar
          node shoot.js daily/${{ steps.fetch.outputs.day }}/ar

      - name: Commit images
        if: steps.gate.outputs.skip != 'true'
        id: commit
        run: |
          git config user.name "dinarchi-rates-bot"
          git config user.email "dinarchi-rates-bot@users.noreply.github.com"
          git add data daily
          git commit -m "Rates posters ${{ steps.fetch.outputs.day }}" || true
          git pull --rebase -q origin main && git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Post the three rates stories to Instagram
        if: steps.gate.outputs.skip != 'true' && ((steps.gate.outputs.daily == 'true' && vars.RATES_AUTOPOST == 'on') || (github.event_name == 'workflow_dispatch' && inputs.publish))
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          DAY=${{ steps.fetch.outputs.day }}
          PAGES="https://surenhawk.github.io/dinarchi-instagram/rates/daily/$DAY"
          BASE="https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.commit.outputs.sha }}/rates/daily/$DAY"
          for i in $(seq 1 20); do
            if curl -sfI "$PAGES/story-1.jpg" >/dev/null && curl -sfI "$PAGES/story-3.jpg" >/dev/null; then BASE="$PAGES"; break; fi
            sleep 15
          done
          echo "media from $BASE"
          if [ "${{ steps.gate.outputs.daily }}" = true ]; then   # post at 12:00 Baghdad, never after 14:00
            now=$(date -u +%s); at=$(date -u -d 'today 09:00' +%s)
            [ "$now" -lt "$at" ] && { echo "waiting $((at - now))s for 12:00 Baghdad"; sleep $((at - now)); }
            [ "$(date -u +%s)" -gt "$(date -u -d 'today 11:00' +%s)" ] && { echo "past 14:00 Baghdad, not posting"; exit 0; }
          fi
          python3 post.py "$DAY" "$BASE"
          git add daily && git commit -m "Published rates stories $DAY" && git pull --rebase -q origin main && git push
